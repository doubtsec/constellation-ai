# The plugin is compiled against a built Constellation, not its source code.
# constellation.dir is a Constellation checkout that has been built (its
# build/cluster directory is used), or override constellation.cluster to point
# straight at the "constellation" cluster of an extracted Constellation release.
# Set either in nbproject/private/platform-private.properties or with -D.
constellation.dir=${suite.dir}/../constellation
constellation.cluster=${constellation.dir}/build/cluster
cluster.path=\
    ${nbplatform.active.dir}/platform:\
    ${constellation.cluster}
nbplatform.active=default
